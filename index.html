<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Incidencias</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h2>Registro de Incidencias</h2>

    <form id="formIncidencia">
      <div>
        <label for="idPedido">ID Pedido:</label>
        <input type="text" id="idPedido" required placeholder="Ej. PED-001" />
      </div>

      <div>
        <label for="tipoIncidencia">Tipo de Incidencia:</label>
        <select id="tipoIncidencia" required>
          <option value="" disabled selected>-- Seleccionar --</option>
          <option value="Retraso">Retraso</option>
          <option value="Falla de maquinaria">Falla de maquinaria</option>
          <option value="Falta de materia prima">Falta de materia prima</option>
        </select>
      </div>

      <div>
        <label for="causa">Causa:</label>
        <textarea
          id="causa"
          rows="3"
          required
          placeholder="Escribe el motivo..."
        ></textarea>
      </div>

      <div>
        <label for="nuevaFecha">Nueva Fecha Estimada:</label>
        <input type="date" id="nuevaFecha" required />
      </div>

      <!-- Botones requeridos -->
      <div class="botones">
        <button type="submit" id="btnGuardar">Guardar Incidencia</button>
        <button type="button" id="btnLimpiar">Limpiar Formulario</button>
      </div>
    </form>

    <hr />

    <h3>Incidencias Registradas</h3>
    <table id="tablaIncidencias" border="1">
      <thead>
        <tr>
          <th>ID Pedido</th>
          <th>Tipo</th>
          <th>Causa</th>
          <th>Nueva Fecha</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <!-- Aquí se agregarán los registros con JavaScript -->
      </tbody>
    </table>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Incidencias</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500&family=Roboto+Mono:wght@500;700&family=Roboto+Serif:wght@600&family=Roboto+Slab:wght@700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />

    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container my-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card mb-4">
            <div class="card-header-custom text-center">
              <div class="icon-badge badge-warning mx-auto mb-2">
                <i class="bi bi-person-fill"></i>
              </div>
              <h2 class="h5 mb-0 titulo-principal">Registro de Incidencias</h2>
            </div>
            <div class="card-body p-4">
              <form id="formIncidencia">
                <div class="mb-3">
                  <label for="idPedido" class="form-label label-subtitulo">
                    <i class="bi bi-box-seam me-1"></i> ID Pedido:
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    id="idPedido"
                    required
                    placeholder="Ej. PED-001"
                  />
                </div>

                <div class="mb-3">
                  <label
                    for="tipoIncidencia"
                    class="form-label label-subtitulo"
                  >
                    <i class="bi bi-tag me-1"></i> Tipo de Incidencia:
                  </label>
                  <select id="tipoIncidencia" class="form-select" required>
                    <option value="" disabled selected>
                      -- Seleccionar --
                    </option>
                    <option value="Retraso">Retraso</option>
                    <option value="Falla de maquinaria">
                      Falla de maquinaria
                    </option>
                    <option value="Falta de materia prima">
                      Falta de materia prima
                    </option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="causa" class="form-label label-subtitulo">
                    <i class="bi bi-pencil-square me-1"></i> Causa:
                  </label>
                  <textarea
                    id="causa"
                    class="form-control"
                    rows="3"
                    required
                    placeholder="Escribe el motivo..."
                  ></textarea>
                </div>

                <div class="mb-4">
                  <label for="nuevaFecha" class="form-label label-subtitulo">
                    <i class="bi bi-calendar-event me-1"></i> Nueva Fecha
                    Estimada:
                  </label>
                  <input
                    type="date"
                    id="nuevaFecha"
                    class="form-control"
                    required
                  />
                </div>

                <div class="d-flex gap-2">
                  <button
                    type="submit"
                    id="btnGuardar"
                    class="btn btn-custom-primary flex-fill"
                  >
                    <i class="bi bi-check-circle-fill me-1"></i> Guardar
                    Incidencia
                  </button>
                  <button
                    type="button"
                    id="btnLimpiar"
                    class="btn btn-custom-secondary flex-fill"
                  >
                    <i class="bi bi-arrow-counterclockwise me-1"></i> Limpiar
                    Formulario
                  </button>
                </div>
              </form>
            </div>
          </div>

          <div class="card">
            <div class="card-header-custom d-flex align-items-center gap-2">
              <div class="icon-badge badge-teal">
                <i class="bi bi-journal-text"></i>
              </div>
              <h3 class="h6 mb-0 subtitulo-seccion">Incidencias Registradas</h3>
            </div>
            <div class="card-body p-4">
              <div class="table-responsive">
                <table
                  id="tablaIncidencias"
                  class="table table-hover align-middle mb-0"
                >
                  <thead class="table-custom-header">
                    <tr>
                      <th><i class="bi bi-hash"></i> ID Pedido</th>
                      <th><i class="bi bi-list-task"></i> Tipo</th>
                      <th><i class="bi bi-chat-left-text"></i> Causa</th>
                      <th><i class="bi bi-calendar3"></i> Nueva Fecha</th>
                      <th class="text-center">
                        <i class="bi bi-gear"></i> Acción
                      </th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
